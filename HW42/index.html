<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/styles.css" />
		<title>forms</title>
	</head>
	<body>
    <form class="form">
      <fieldset class="form-group-1">
		<legend class="form-groop-title">Ваши личные данные</legend>
          <label class="label">Ваше имя 
				    <input type="text" placeholder="Имя" name="name" required /></label>
          <label class="label">Ваш возраст
            <input type="number" placeholder="Возраст" name="age" required/></label>
          <label class="label">Ваш номер телефона
				    <input type="tel" placeholder="Номер телефона " name="tel" required inputmode="tel"/> 
          </label>
          <label class="label">Ваша почта 
            <input type="email" placeholder="Почта" name="email" required inputmode="email"/>
					</label></fieldset>
          <fieldset class="form-group-2">
				<label class="label" for="message"> Сообщение</label>
          <textarea id="message" class="textarea" placeholder="Ваше сообщение" name="message" required/></textarea>
			    <label class="label">
				 <input type="checkbox" required name="rulez" value="rulez" /> Я принимаю правила
			 </label>
		  </fieldset>
			<button class="button">Отправить</button>
    </form>
	</body>
</html>
